name = "binance-futures-proxy"
main = "binance-proxy.js"
compatibility_date = "2026-05-20"
workers_dev = true

[observability]
enabled = false

[secrets]
required = ["TRADING_PROXY_KEY"]

[[routes]]
pattern = "bnp.therainisme.com"
custom_domain = true

# Keep TRADING_PROXY_KEY as a Worker secret:
# npx wrangler secret put TRADING_PROXY_KEY
